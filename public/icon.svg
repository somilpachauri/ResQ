<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E0C25" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Glowing purple gradient for lines -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Soft purple glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="100" />

  <!-- Outer Neon Glowing Circle -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#neonPurple)" stroke-width="3" filter="url(#glow)" opacity="0.8" />

  <!-- Segmented Ring Panels (8 blocks like high-tech dial, matching user's images) -->
  <g stroke="url(#neonPurple)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow-subtle)" opacity="0.85">
    <!-- Top -->
    <path d="M 210,62 A 200,200 0 0,1 302,62" />
    <!-- Top-Right -->
    <path d="M 352,112 A 200,200 0 0,1 400,160" />
    <!-- Right -->
    <path d="M 450,210 A 200,200 0 0,1 450,302" />
    <!-- Bottom-Right -->
    <path d="M 400,352 A 200,200 0 0,1 352,400" />
    <!-- Bottom -->
    <path d="M 302,450 A 200,200 0 0,1 210,450" />
    <!-- Bottom-Left -->
    <path d="M 160,400 A 200,200 0 0,1 112,352" />
    <!-- Left -->
    <path d="M 62,302 A 200,200 0 0,1 62,210" />
    <!-- Top-Left -->
    <path d="M 112,160 A 200,200 0 0,1 160,112" />
  </g>

  <!-- Inner Glowing Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonPurple)" stroke-width="4" stroke-dasharray="120 40 80 40" filter="url(#glow-subtle)" opacity="0.6" />

  <!-- Central Letter "R" -->
  <g transform="translate(142, 126)" filter="url(#glow)">
    <path d="M0 0 H115 C175 0, 215 30, 215 85 C215 135, 175 165, 115 165 H45 V260 H0 V0 Z M45 42 V123 H110 C140 123, 168 113, 168 82 C168 52, 140 42, 110 42 H45 Z" fill="url(#neonPurple)" />
    <path d="M110 145 L195 260 H140 L65 158" fill="url(#neonPurple)" />
  </g>
</svg>
